name: 合并转码 FLV → MP4

# 由 Unikraft 实例通过 workflow_dispatch 触发。
#
# 职责变了：不再「一段转一次」，而是整场直播录完后一次性处理：
#   1. 从 R2 拉下所有分段（每个 5 分钟）
#   2. ffmpeg concat 合并成一个文件再转 H.264 + AAC
#   3. 分片上传到 OpenList
#   4. 清理 R2 上的所有分段
#
# 为什么合并后统一转：
#   - 每段单独转码再拼接，接缝处会有时间戳跳变，播放器拖动会卡
#   - 一次转码能重新分配码率，整场体积更小
#   - Actions 分钟数只花一次，而不是 N 次
on:
  workflow_dispatch:
    inputs:
      # 多个 R2 对象键，逗号分隔，按顺序合并
      r2_keys:
        description: 'R2 对象键列表（逗号分隔，按录制顺序）'
        required: false
        type: string
        default: ''
      # 兼容旧调用：单个预签名 URL
      source_url:
        description: '（可选）单个源文件 URL，给非直播任务用'
        required: false
        type: string
        default: ''
      # 单文件模式的对象键，用来在转码成功后删掉 R2 源文件。
      # 必须在这里声明：dispatch 接口对未声明的 input 直接返回 422。
      r2_key:
        description: '（可选）单个 R2 对象键，转完用来清理'
        required: false
        type: string
        default: ''
      out_name:
        description: '输出文件名（含 .mp4）'
        required: true
        type: string
        default: 'output.mp4'
      openlist_dir:
        description: 'OpenList 目标目录'
        required: true
        type: string
        default: '/od-20200439/cloudfetch'
      crf:
        description: 'H.264 CRF（越小越清晰）'
        required: false
        type: string
        default: '23'
      preset:
        description: 'x264 preset'
        required: false
        type: string
        default: 'veryfast'
      task_id:
        description: '来源任务 id（仅用于标记）'
        required: false
        type: string
        default: ''

# 同一个任务只允许一次合并转码，避免重复跑
concurrency:
  group: transcode-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  transcode:
    # 固定到 24.04 而不是 ubuntu-latest。
    #
    # ubuntu-latest 在 2026-10 会迁移到 26.04，届时 apt 源、ffmpeg 版本、
    # 预装工具都可能变，构建会突然失败。固定大版本可以自己控制升级时机。
    # 出现这条警告就是提醒：
    #   "The ubuntu-latest label will migrate to Ubuntu 26 beginning October 19, 2026"
    runs-on: ubuntu-24.04
    # 3 小时直播的合并转码在 4 核 runner 上接近实时，留足余量。
    # 服务端的 TRANSCODE_TIMEOUT（330 分钟）必须比这个更长。
    timeout-minutes: 350

    # 只需要读代码，不需要写仓库
    permissions:
      contents: read

    steps:
      # checkout@v5 / setup-node@v5 已经跑在 Node 24 上。
      # v4 系列仍声明 Node 20，GitHub 会强制降级到 Node 24 并打警告：
      #   "Node.js 20 is deprecated. The following actions target Node.js 20
      #    but are being forced to run on Node.js 24"
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 输入来自服务端，但 workflow 也能被有仓库权限的人手动触发，
      # 所以对目标目录做一次格式校验：必须是绝对路径且不含 ..
      - name: 校验参数
        env:
          OPENLIST_DIR: ${{ inputs.openlist_dir }}
          OUT_NAME: ${{ inputs.out_name }}
        run: |
          set -euo pipefail
          case "$OPENLIST_DIR" in
            /*) ;;
            *) echo "::error::openlist_dir 必须是绝对路径，收到：$OPENLIST_DIR"; exit 1 ;;
          esac
          case "$OPENLIST_DIR" in
            *..*) echo "::error::openlist_dir 不能包含 .."; exit 1 ;;
          esac
          case "$OUT_NAME" in
            */*|*..*) echo "::error::out_name 不能包含路径分隔符"; exit 1 ;;
          esac
          echo "参数校验通过：$OPENLIST_DIR / $OUT_NAME"

      # ubuntu-24.04 默认不带 ffmpeg，必须自己装。
      # apt 源里的 ffmpeg 已编译进 libx264 和 aac，够用。
      - name: 安装 ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E 'libx264|aac' || {
            echo "::error::ffmpeg 缺少 libx264 或 aac 编码器"
            exit 1
          }

      - name: 合并转码并上传
        env:
          R2_KEYS: ${{ inputs.r2_keys }}
          R2_KEY: ${{ inputs.r2_key }}
          SOURCE_URL: ${{ inputs.source_url }}
          OUT_NAME: ${{ inputs.out_name }}
          OPENLIST_DIR: ${{ inputs.openlist_dir }}
          CRF: ${{ inputs.crf }}
          PRESET: ${{ inputs.preset }}
          TASK_ID: ${{ inputs.task_id }}
          OPENLIST_URL: ${{ vars.OPENLIST_URL }}
          OPENLIST_TOKEN: ${{ secrets.OPENLIST_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_DELETE_AFTER: 'true'
        run: node scripts/transcode-worker.mjs

      - name: 写入摘要
        if: always()
        run: |
          {
            echo "## 合并转码结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 输出文件 | \`${{ inputs.out_name }}\` |"
            echo "| 目标目录 | \`${{ inputs.openlist_dir }}\` |"
            echo "| 分段数 | $(echo "${{ inputs.r2_keys }}" | tr ',' '\n' | grep -c . || echo 0) |"
            echo "| CRF | ${{ inputs.crf }} |"
            echo "| 任务 | \`${{ inputs.task_id }}\` |"
            echo "| 状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
