name: Unikraft 部署

# 手动触发，或 push 到 main 且改动了业务代码时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'unikraft/app/**'
      - '.github/workflows/unikraft-deploy.yml'

env:
  IMAGE_NAME: cloudfetch
  UKC_VERSION: 0.6.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # unikraft images build 依赖本地 BuildKit，runner 自带的 docker 正好能提供。
      # 本地实测：没有 BuildKit 会直接报
      #   "buildkit not found; please start a docker or buildkit daemon"
      - name: 确认 BuildKit 可用
        run: |
          set -euo pipefail
          docker version
          docker buildx version

      - name: 安装 unikraft CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE="unikraft-cli_${UKC_VERSION}_linux_amd64.tar.gz"

          # 用 gh release download 而不是 curl 直链。
          #
          # 原因：GitHub 的 release 直链（objects.githubusercontent.com）
          # 会返回 504，而同一台机器上 gh 走 API 拿到的下载地址是好的。
          # 实测 curl 对 tar.gz / deb / rpm / checksums 全部 504，
          # 但 `gh release download` 一次成功 14MB。
          #
          # gh 会自动跟随重定向并处理鉴权，runner 上预装了 gh。
          for i in 1 2 3 4 5; do
            if gh release download "v${UKC_VERSION}" \
                 --repo unikraft-cloud/cli \
                 --pattern "$FILE" \
                 --dir /tmp \
                 --clobber; then
              echo "下载成功（第 $i 次尝试）"
              break
            fi
            delay=$(( i * 5 ))
            echo "第 $i 次下载失败，${delay}s 后重试…"
            sleep "$delay"
            if [ "$i" -eq 5 ]; then
              echo "::error::无法下载 unikraft CLI v${UKC_VERSION}"
              exit 1
            fi
          done

          sudo tar -xzf "/tmp/$FILE" -C /usr/local/bin unikraft
          unikraft version

      - name: 登录 Unikraft
        env:
          UKC_TOKEN: ${{ secrets.UNIKRAFT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UKC_TOKEN:-}" ]; then
            echo "::error::缺少 UNIKRAFT_TOKEN secret"
            exit 1
          fi
          printf '%s' "$UKC_TOKEN" > /tmp/ukc.token
          unikraft login --token /tmp/ukc.token --no-browser
          rm -f /tmp/ukc.token

      - name: 构建镜像
        env:
          UKC_ORG: ${{ secrets.UNIKRAFT_ORG }}
        run: |
          set -euo pipefail
          ORG="${UKC_ORG:-panpp123}"
          echo "ORG=$ORG" >> "$GITHUB_ENV"
          # Dockerfile 在仓库根目录，构建上下文就是根目录，
          # 这样 COPY src/ 和 COPY public/ 才能找到文件。
          unikraft images build . \
            --arch x86_64 \
            --output "${ORG}/${IMAGE_NAME}:latest" \
            --no-cache 2>&1 | tee /tmp/build.log

      - name: 构建日志
        if: always()
        run: tail -60 /tmp/build.log 2>/dev/null || echo "(无日志)"

      - name: 写入摘要
        if: success()
        run: |
          {
            echo "## 镜像构建成功"
            echo ""
            echo "- \`${{ env.ORG }}/${{ env.IMAGE_NAME }}:latest\`"
            echo ""
            echo "### 部署"
            echo ""
            echo '```bash'
            echo "./unikraft/deploy-app.sh fra"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
